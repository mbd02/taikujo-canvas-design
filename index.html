*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:14px/1.45 var(--font-ui);color:var(--text);background:var(--bg)}

 const d=defaults();if(!raw||raw.version!==VERSION||!Array.isArray(raw.cards)||raw.cards.length!==d.cards.length)throw Error('version');
 for(const key of ['skin','mode','language','visibility','radius']){
  const values={skin:['default','office','glass','studio','clay'],mode:['dark','light'],language:['de','en'],visibility:['always','hover'],radius:['theme','round','square']}[key];if(!values.includes(raw[key]))throw Error(key);d[key]=raw[key];
 }
 for(const [key,[min,max]] of Object.entries({...specs,zoom:[1,100]})){if(typeof raw[key]!=='number'||!Number.isFinite(raw[key])||raw[key]<min||raw[key]>max)throw Error(key);d[key]=raw[key];}
 for(const key of ['constant','area']){if(typeof raw[key]!=='boolean')throw Error(key);d[key]=raw[key];}
 if(!Array.isArray(raw.actions)||raw.actions.length>actions.length+1||new Set(raw.actions).size!==raw.actions.length||raw.actions.some(key=>!actions.includes(key)&&key!=='chat'))throw Error('actions');d.actions=raw.actions.filter(key=>key!=='chat');
 d.cards=d.cards.map((base,index)=>{const c=raw.cards[index];if(!c||c.id!==base.id||c.kind!==base.kind||!kinds.includes(c.kind)||typeof c.title!=='string'||c.title.length>160||typeof c.note!=='string'||c.note.length>2000)throw Error('card');for(const key of ['x','y'])if(!Number.isFinite(c[key])||c[key]<0||c[key]>1400)throw Error(key);if(base.kind==='task'&&!['open','done'].includes(c.status))throw Error('status');if(base.kind==='tunnel'&&((c.account!==undefined&&(typeof c.account!=='string'||c.account.length>120))||(c.scope!==undefined&&!TUNNEL_SCOPES.includes(c.scope))))throw Error('tunnel');return {...base,title:c.title,note:c.note,x:c.x,y:c.y,...(base.kind==='task'?{status:c.status}:{}),...(base.kind==='tunnel'?{account:c.account??base.account,scope:c.scope??base.scope}:{})};});return d;
}
let state=defaults(),selected=null,tunnelTab='view',tunnelFolder=null,storageAvailable=true;
try{const stored=localStorage.getItem(STORAGE);if(stored)state=validate(JSON.parse(stored));}catch{storageAvailable=false;}
const $=id=>document.getElementById(id),t=key=>copy[key][state.language==='en'?1:0];
function notice(message){$('notice').textContent=message;}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));storageAvailable=true;}catch{storageAvailable=false;notice(t('unsaved'));}}
function svg(id){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-${id}"></use></svg>`;}
function picture(){return '<svg class="preview-image" viewBox="0 0 400 240" aria-label="Dummy image"><use href="#picture"></use></svg>';}
function makeRange(key,parent){const [min,max,step]=specs[key];const label=document.createElement('label');label.className='control';label.innerHTML=`<span><span data-ui="${key}"></span><output id="${key}-value"></output></span><input id="${key}" type="range" min="${min}" max="${max}" step="${step}">`;parent.append(label);$(key).addEventListener('input',()=>{state[key]=Number($(key).value);apply();save();});}
for(const key of ['offset','gap','padding','iconSize'])makeRange(key,$('pill-controls'));
for(const key of ['width','height','titleSize','titleLines','tracking'])makeRange(key,$('card-controls'));
for(const key of actions){const label=document.createElement('label');label.innerHTML=`<input type="checkbox" id="action-${key}"><span data-ui="${key}"></span>`;$('function-controls').append(label);$('action-'+key).addEventListener('change',()=>{state.actions=actions.filter(action=>$('action-'+action).checked);renderCards();save();});}
function apply(){
 document.documentElement.dataset.skin=state.skin;document.documentElement.dataset.theme=state.mode;document.documentElement.lang=state.language;
 for(const el of document.querySelectorAll('[data-ui]'))el.textContent=t(el.dataset.ui);
 for(const key of ['skin','mode','language','radius','visibility','zoom'])$(key).value=state[key];
 for(const key of ['constant','area'])$(key).checked=state[key];
 for(const key of actions)$('action-'+key).checked=state.actions.includes(key);
 for(const [key,[,,,unit]] of Object.entries(specs)){$(key).value=state[key];$(key+'-value').textContent=state[key]+unit;}
 const camera=.35+(state.zoom-1)/99*.4;
 const css={'--card-width':state.width+'px','--card-height':state.height+'px','--card-radius':'var(--radius-lg)','--title-size':state.titleSize+'px','--title-lines':state.titleLines,'--tracking':state.tracking+'px','--pill-offset':state.offset+'px','--pill-gap':state.gap+'px','--pill-padding':state.padding+'px','--icon-size':state.iconSize+'px','--pill-radius':state.radius==='round'?'999px':state.radius==='square'?'0px':state.skin==='office'?'0px':state.skin==='clay'?'var(--radius-lg)':'var(--radius-control)','--pill-scale':state.constant?1/camera:1};
 for(const [key,value] of Object.entries(css))$('world').style.setProperty(key,value);
 $('world').style.transform=`scale(${camera})`;document.querySelector('.extent').style.width=1400*camera+'px';document.querySelector('.extent').style.height=860*camera+'px';
 $('revision-readout').textContent=t('revision')+' · '+PREVIEW_REVISION;$('zoom-value').textContent=state.zoom+'%';$('zoom-readout').textContent=state.zoom+'% · '+(state.language==='de'?'Desk-Zoom':'Desk zoom');
 renderCards();selectionControls();
}
function chatPill(card){
 const anchor=document.createElement('div');anchor.className='chat-pill-anchor';
 const pill=document.createElement('div');pill.className='pill chat-pill';pill.setAttribute('aria-label',t('chat'));
 const button=document.createElement('button');button.type='button';button.dataset.action='chat';button.setAttribute('aria-label',t('chat'));button.innerHTML=svg('chat');
 const tooltip=document.createElement('span');tooltip.className='tooltip';tooltip.textContent=t('chat');button.append(tooltip);button.addEventListener('click',()=>action(card,'chat'));
 pill.append(button);anchor.append(pill);return anchor;
}
function renderCards(){
 const world=$('world');world.replaceChildren();
 if(state.area){const area=document.createElement('div');area.className='area';const label=document.createElement('span');label.className='area-label';label.textContent=t('research');area.append(label,chatPill({id:'area',kind:'area',title:t('research'),note:''}));world.append(area);}
 for(const card of state.cards){
  const node=document.createElement('article');node.className='node'+(selected===card.id?' selected':'');node.dataset.id=card.id;node.dataset.kind=card.kind;node.dataset.pillVisibility=state.visibility;node.tabIndex=0;node.setAttribute('aria-label',card.title);node.style.left=card.x+'px';node.style.top=card.y+'px';
  const size=cardSize(card);node.style.width=size.width+'px';node.style.height=size.height+'px';node.insertAdjacentHTML('beforeend',cardShape(card));
  const surface=document.createElement('div');surface.className='surface';
  const title=document.createElement('div');title.className='title';title.textContent=card.title;title.title=card.title;
  if(['file','stack'].includes(card.kind)){
   if(card.kind==='stack'){
    const covers=document.createElement('div');covers.className='stack-covers';
    const examples=[{width:256,height:184,type:'PNG'},{width:160,height:240,type:'MD'},{width:180,height:250,type:'PDF'}];
    examples.forEach((example,index)=>{const cover=document.createElement('div');cover.className='stack-cover';cover.style.setProperty('--stack-cover-index',index);cover.style.setProperty('--stack-cover-width',example.width*state.width/256+'px');cover.style.setProperty('--stack-cover-height',example.height*state.height/159+'px');
     if(index===0)cover.innerHTML=picture();else{const text=document.createElement('div');text.className='stack-cover-fallback';text.textContent=index===1?'# Launch\n\nBriefing.md\n\nIdeen sammeln\nVariante prüfen':'Entwurf.pdf\n\nLaunch 2026\n\nDesign Review';cover.append(text);}
     const type=document.createElement('span');type.className='stack-cover-type';type.textContent=example.type;cover.append(type);covers.append(cover);
    });surface.append(covers);const count=document.createElement('span');count.className='stack-count';count.textContent='4';surface.append(count);
   }else{const thumb=document.createElement('div');thumb.className='thumbnail';thumb.innerHTML=picture();surface.append(thumb);}
   const caption=document.createElement('div');caption.className='file-title';caption.append(title);surface.append(caption);
  }
  else if(card.kind==='tunnel'){
   const logo=document.createElement('span');logo.className='tunnel-logo';logo.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#tunnel-provider-icon"></use></svg>';surface.append(logo);
   const hover=document.createElement('div');hover.className='tunnel-hover';hover.setAttribute('role','tooltip');hover.id='tunnel-hover-'+card.id;
   for(const [label,value] of [[t('account'),card.account],[t('scope'),card.scope]]){const row=document.createElement('span');row.textContent=label+': '+value;hover.append(row);}node.setAttribute('aria-describedby',hover.id);node.append(hover);
  }else surface.append(title);
  node.append(surface);const anchor=document.createElement('div');anchor.className='pill-anchor';const pill=document.createElement('div');pill.className='pill';pill.setAttribute('aria-label',t('pill'));
  for(const key of state.actions){
   if(key==='status'&&card.kind!=='task'||key==='preview'&&!['file','stack','tunnel'].includes(card.kind))continue;
   const btn=document.createElement('button');btn.type='button';btn.dataset.action=key;btn.setAttribute('aria-label',t(key));btn.className=key;
   if(key==='status'){btn.classList.toggle('done',card.status==='done');btn.innerHTML=card.status==='done'?svg('check'):'<span aria-hidden="true">○</span>';const text=document.createElement('span');text.textContent=t(card.status);btn.append(text);}
   else btn.innerHTML=svg(icons[key]);
   const tooltip=document.createElement('span');tooltip.className='tooltip';tooltip.textContent=t(key);btn.append(tooltip);btn.addEventListener('click',()=>action(card,key));pill.append(btn);
  }
  if(card.kind==='desk'){const btn=document.createElement('button');btn.type='button';btn.setAttribute('aria-label',t('desk'));btn.innerHTML=svg('open');btn.onclick=()=>action(card,'desk');pill.append(btn);}
  if(pill.children.length){anchor.append(pill);node.append(anchor);}node.append(chatPill(card));world.append(node);
  node.addEventListener('dblclick',event=>{if(card.kind==='tunnel'&&!event.target.closest('button')){event.preventDefault();showTunnelInspector(card);}});node.addEventListener('pointerdown',event=>startDrag(event,node,card));node.addEventListener('keydown',event=>{if(event.target!==node)return;if(event.key==='Enter'||event.key===' '){event.preventDefault();choose(card.id);}});
 }
}
function choose(id){if(selected!==id){tunnelTab='view';tunnelFolder=null;}selected=id;for(const node of document.querySelectorAll('.node'))node.classList.toggle('selected',node.dataset.id===id);selectionControls();}
function selectionControls(){
 const card=state.cards.find(c=>c.id===selected);const tunnel=card?.kind==='tunnel';
 $('selection-hint').hidden=!!card;$('selection-controls').hidden=!card;$('tunnel-inspector').hidden=!tunnel;
 $('title').closest('label').hidden=tunnel;$('note').closest('label').hidden=tunnel;$('task-state').closest('label').hidden=card?.kind!=='task';
 if(!card)return;$('title').value=card.title;$('note').value=card.note;$('task-state').value=card.status||'open';if(tunnel)renderTunnelInspector(card);
}
function showTunnelInspector(card){choose(card.id);tunnelTab='view';renderTunnelInspector(card);$('tunnel-inspector').scrollIntoView({block:'start',behavior:'instant'});}
function renderTunnelInspector(card){
 const host=$('tunnel-inspector-content');host.replaceChildren();
 $('tunnel-view-tab').textContent=t('view');$('tunnel-edit-tab').textContent=t('edit');
 $('tunnel-view-tab').setAttribute('aria-selected',String(tunnelTab==='view'));$('tunnel-edit-tab').setAttribute('aria-selected',String(tunnelTab==='edit'));
 $('tunnel-view-tab').setAttribute('aria-pressed',String(tunnelTab==='view'));$('tunnel-edit-tab').setAttribute('aria-pressed',String(tunnelTab==='edit'));
 if(tunnelTab==='edit'){
  const account=document.createElement('p');account.className='muted';account.textContent=t('account')+': '+card.account;host.append(account);
  const label=document.createElement('label');label.className='control';const caption=document.createElement('span');caption.textContent=t('scope');const select=document.createElement('select');select.id='tunnel-scope';select.setAttribute('aria-label',t('scope'));
  for(const scope of TUNNEL_SCOPES){const option=document.createElement('option');option.value=scope;option.textContent=scope;select.append(option);}select.value=card.scope;
  select.onchange=()=>{card.scope=select.value;tunnelFolder=null;renderCards();save();};label.append(caption,select);host.append(label);
  const help=document.createElement('p');help.className='tunnel-editor-help';help.textContent=t('scopeLimit');host.append(help);return;
 }
 const list=document.createElement('div');list.className='tunnel-content';host.append(list);
 const folder=tunnelFolder||card.scope;
 function item(name,kind,handle){const btn=document.createElement('button');btn.type='button';const icon=document.createElement('span');icon.setAttribute('aria-hidden','true');icon.textContent=kind==='folder'?'▸':'▤';const text=document.createElement('span');text.textContent=name;btn.append(icon,text);
  btn.onclick=()=>{if(kind==='folder'){tunnelFolder=handle;renderTunnelInspector(card);}else{list.replaceChildren();const back=document.createElement('button');back.textContent=t('back');back.onclick=()=>renderTunnelInspector(card);const preview=document.createElement('div');preview.className='content-preview';if(name.endsWith('.png'))preview.innerHTML=picture();else preview.textContent='# '+name+'\n\n'+t('dummyFile');list.append(back,preview);}};list.append(btn);}
 if(tunnelFolder&&tunnelFolder!==card.scope){const back=document.createElement('button');back.type='button';back.textContent='‹ '+t('back');back.onclick=()=>{tunnelFolder=null;renderTunnelInspector(card);};list.append(back);}
 if(folder==='Launch-Team'){item('Briefing','folder','Launch-Team/Briefing');item('Entwürfe','folder','Launch-Team/Entwürfe');item('Moodboard.png','file');}
 else if(folder==='Launch-Team/Briefing'){item('Briefing.md','file');item('Zeitplan.txt','file');}else{item('Entwurf.pdf','file');item('Variante.png','file');}
}

function startDrag(event,node,card){
 if(event.target.closest('button')||event.button!==0)return;
 choose(card.id);event.preventDefault();node.setPointerCapture(event.pointerId);node.classList.add('dragging');
 const camera=.35+(state.zoom-1)/99*.4,start={x:event.clientX,y:event.clientY,cx:card.x,cy:card.y};
 const move=e=>{card.x=Math.round(Math.max(0,Math.min(1400-cardSize(card).width,start.cx+(e.clientX-start.x)/camera)));card.y=Math.round(Math.max(0,Math.min(860-cardSize(card).height-60,start.cy+(e.clientY-start.y)/camera)));node.style.left=card.x+'px';node.style.top=card.y+'px';};
 const end=()=>{node.classList.remove('dragging');node.removeEventListener('pointermove',move);node.removeEventListener('pointerup',end);node.removeEventListener('pointercancel',end);node.removeEventListener('lostpointercapture',end);save();};
 node.addEventListener('pointermove',move);node.addEventListener('pointerup',end);node.addEventListener('pointercancel',end);node.addEventListener('lostpointercapture',end);
}
function action(card,key){
 choose(card.id);
 if(card.kind==='tunnel'&&['preview','menu'].includes(key)){showTunnelInspector(card);return;}
 if(key==='status'){card.status=card.status==='done'?'open':'done';renderCards();selectionControls();save();return;}
 const content=$('modal-content');content.replaceChildren();$('modal-title').textContent=key==='desk'?t('desk'):t(key);
 if(key==='preview')content.innerHTML=picture();
 const text=document.createElement('p');text.textContent=key==='chat'?t('demoChat'):key==='links'?t('demoLinks'):key==='calendar'?t('demoCalendar'):key==='menu'?t('demoMenu'):key==='desk'?t('demoDesk'):key==='creator'?'Alex · AI Worker':key==='checklist'?'2 / 5':(card.note||t('empty'));content.append(text);if(!$('modal').open)$('modal').showModal();
}
for(const [id,tab] of [['tunnel-view-tab','view'],['tunnel-edit-tab','edit']])$(id).onclick=()=>{const card=state.cards.find(c=>c.id===selected);if(card?.kind==='tunnel'){tunnelTab=tab;renderTunnelInspector(card);}};
for(const key of ['skin','mode','language','visibility','radius'])$(key).addEventListener('change',()=>{state[key]=$(key).value;apply();save();});
for(const key of ['constant','area'])$(key).addEventListener('change',()=>{state[key]=$(key).checked;apply();save();});
$('zoom').addEventListener('input',()=>{state.zoom=Number($('zoom').value);apply();save();});
for(const key of ['title','note'])$(key).addEventListener('input',()=>{const card=state.cards.find(c=>c.id===selected);if(!card)return;card[key]=$(key).value;renderCards();save();});
$('task-state').addEventListener('change',()=>{const card=state.cards.find(c=>c.id===selected);if(card?.kind==='task'){card.status=$('task-state').value;renderCards();save();}});
$('close-modal').onclick=()=>$('modal').close();$('modal').addEventListener('click',event=>{if(event.target!==$('modal'))return;const r=$('modal').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)$('modal').close();});
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)+'\n'],{type:'application/json'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='taikujo-canvas-design.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notice(t('saved'));};
$('import').onclick=()=>$('import-file').click();$('import-file').onchange=async()=>{const file=$('import-file').files[0];if(!file)return;try{if(file.size>100000)throw Error('size');const candidate=validate(JSON.parse(await file.text()));state=candidate;selected=null;apply();save();notice(t('loaded'));}catch{notice(t('invalid'));}finally{$('import-file').value='';}};
$('reset').onclick=()=>{state=defaults();selected=null;tunnelTab='view';tunnelFolder=null;apply();save();notice('');};
apply();if(!storageAvailable)notice(t('unsaved'));
</script>
</body>
